setup:
  steps:
    - step: "Create payroll journal"
      action: "create"
      model: "account.journal"
      save_as: "journal"
      values:
        name: "Test M2O Configurator Journal"
        code: "TM2OJ"
        type: "general"

    - step: "Create salary structure"
      action: "create"
      model: "hr.salary_structure"
      save_as: "structure"
      values:
        name: "Test M2O Configurator Structure"
        code: "TM2OSTR"

    - step: "Create payslip employee"
      action: "create"
      model: "hr.employee"
      save_as: "employee"
      values:
        name: "Test M2O Configurator Employee"
        salary_structure_id: "REC: structure.id"

    - step: "Create analytic account (candidate to include)"
      action: "create"
      model: "account.analytic.account"
      save_as: "aa_1"
      values:
        name: "Test M2O AA Include"

    - step: "Create analytic account (candidate to exclude)"
      action: "create"
      model: "account.analytic.account"
      save_as: "aa_2"
      values:
        name: "Test M2O AA Exclude"

    - step: "Create product usage type (candidate to include)"
      action: "create"
      model: "product.usage_type"
      save_as: "usage_1"
      values:
        name: "Test M2O Usage Include"
        code: "TM2OUSG1"

    - step: "Create product usage type (candidate to exclude)"
      action: "create"
      model: "product.usage_type"
      save_as: "usage_2"
      values:
        name: "Test M2O Usage Exclude"
        code: "TM2OUSG2"

    - step: "Create employee (candidate to include)"
      action: "create"
      model: "hr.employee"
      save_as: "employee_1"
      values:
        name: "Test M2O Employee Include"

    - step: "Create employee (candidate to exclude)"
      action: "create"
      model: "hr.employee"
      save_as: "employee_2"
      values:
        name: "Test M2O Employee Exclude"

scenarios:
  - name: "HR Payslip - Allowed analytic accounts via manual method"
    steps:
      - step: "Create payslip type with manual analytic account configurator"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Test M2O AA Manual Type"
          code: "TM2OAAMAN"
          journal_id: "REC: journal.id"
          analytic_account_selection_method: "manual"
          analytic_account_ids:
            - "REC: aa_1.id"

      - step: "Create payslip"
        action: "create"
        model: "hr.payslip"
        save_as: "payslip"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: payslip_type.id"
          structure_id: "REC: structure.id"
          journal_id: "REC: journal.id"
          date_start: "2026-01-01"
          date_end: "2026-01-31"
          date: "2026-01-31"

      - step: "Assert allowed analytic accounts contains exactly the manual list"
        action: "assert"
        target: "payslip"
        asserts:
          allowed_analytic_account_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: aa_1"

  - name: "HR Payslip - Allowed analytic accounts via domain method"
    steps:
      - step: "Create payslip type with domain analytic account configurator"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Test M2O AA Domain Type"
          code: "TM2OAADOM"
          journal_id: "REC: journal.id"
          analytic_account_selection_method: "domain"
          analytic_account_domain: "[('name', '=', 'Test M2O AA Include')]"

      - step: "Create payslip"
        action: "create"
        model: "hr.payslip"
        save_as: "payslip"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: payslip_type.id"
          structure_id: "REC: structure.id"
          journal_id: "REC: journal.id"
          date_start: "2026-02-01"
          date_end: "2026-02-28"
          date: "2026-02-28"

      - step: "Assert allowed analytic accounts filtered by domain"
        action: "assert"
        target: "payslip"
        asserts:
          allowed_analytic_account_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: aa_1"

  - name: "HR Payslip - Allowed analytic accounts via python code method"
    steps:
      - step: "Create payslip type with python code analytic account configurator"
