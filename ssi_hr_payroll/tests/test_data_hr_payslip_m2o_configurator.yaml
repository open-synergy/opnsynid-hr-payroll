          name: "Test M2O AA Code Type"
          code: "TM2OAACOD"
          journal_id: "REC: journal.id"
          analytic_account_selection_method: "code"
          analytic_account_python_code:
            "result = env['account.analytic.account'].search([('name', '=', 'Test M2O AA
            Include')])"

      - step: "Create payslip"
        action: "create"
        model: "hr.payslip"
        save_as: "payslip"
