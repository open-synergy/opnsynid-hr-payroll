        save_as: "aa_2"
        values:
          name: "Test M2O AA Domain Exclude"

      - step: "Create payslip type with domain analytic account configurator"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Test M2O AA Domain Type"
          code: "TM2OAADOM"
          journal_id: "REC: journal.id"
          analytic_account_selection_method: "domain"
          analytic_account_domain: "[('name', '=', 'Test M2O AA Domain Include')]"

      - step: "Create payslip"
        action: "create"
        model: "hr.payslip"
        save_as: "payslip"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: payslip_type.id"
          structure_id: "REC: structure.id"
          journal_id: "REC: journal.id"
          date_start: "2026-02-01"
          date_end: "2026-02-28"
          date: "2026-02-28"

      - step: "Assert allowed analytic accounts filtered by domain"
        action: "assert"
        target: "payslip"
        asserts:
          allowed_analytic_account_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: aa_1"

