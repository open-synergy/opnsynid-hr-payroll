  - name: "HR Payslip - Resolve debit/credit account from product usage"
    steps:
      - step: "Get expense account type"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "expense_account_type"

      - step: "Create debit account (resolved via debit usage)"
        action: "create"
        model: "account.account"
        save_as: "debit_account"
        values:
          name: "Test Usage Debit Account"
          code: "TSTUSG_DB"
          user_type_id: "EVAL: registry['expense_account_type'].id"

      - step: "Create credit account (resolved via credit usage)"
