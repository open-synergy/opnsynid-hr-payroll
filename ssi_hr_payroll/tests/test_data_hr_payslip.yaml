        action: "call"
        target: "payslip"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert accounting entry created despite empty fixed accounts"
        action: "assert"
        target: "payslip"
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"

      - step: "Assert credit line landed on credit-usage account"
        action: "search"
        model: "account.move.line"
        save_as: "credit_lines"
        expect_count: 1
        domain:
          - ["move_id", "=", "EVAL: registry['payslip'].move_id.id"]
          - ["account_id", "=", "EVAL: registry['credit_account'].id"]
          - ["credit", ">", 0.0]

      - step: "Assert debit line landed on debit-usage account"
        action: "search"
        model: "account.move.line"
        save_as: "debit_lines"
        expect_count: 1
        domain:
          - ["move_id", "=", "EVAL: registry['payslip'].move_id.id"]
          - ["account_id", "=", "EVAL: registry['debit_account'].id"]
          - ["debit", ">", 0.0]

