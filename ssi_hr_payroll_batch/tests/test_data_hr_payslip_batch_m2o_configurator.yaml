scenarios:
  - name: "HR Payslip Batch - Allowed analytic accounts via manual method"
    steps:
      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Batch M2O Configurator Journal 1"
          code: "TBM2OJ1"
          type: "general"

      - step: "Create analytic account (candidate to include)"
        action: "create"
        model: "account.analytic.account"
        save_as: "aa_1"
        values:
          name: "Test Batch M2O AA Manual Include"

      - step: "Create analytic account (candidate to exclude)"
        action: "create"
        model: "account.analytic.account"
        save_as: "aa_2"
        values:
          name: "Test Batch M2O AA Manual Exclude"

      - step: "Create payslip type with manual analytic account configurator"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Test Batch M2O AA Manual Type"
          code: "TBM2OAAMAN"
          journal_id: "REC: journal.id"
          analytic_account_selection_method: "manual"
          analytic_account_ids:
            - "REC: aa_1.id"

      - step: "Create payslip batch"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type.id"
          date_start: "2026-01-01"
          date_end: "2026-01-31"
          date: "2026-01-31"

      - step: "Assert allowed analytic accounts contains exactly the manual list"
        action: "assert"
        target: "batch"
        asserts:
          allowed_analytic_account_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: aa_1"

  - name:
      "HR Payslip Batch - Allowed debit/credit usages via manual method, no cross leak"
    steps:
      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Batch M2O Configurator Journal 2"
          code: "TBM2OJ2"
          type: "general"

      - step: "Create product usage type for debit side"
        action: "create"
        model: "product.usage_type"
        save_as: "debit_usage"
        values:
          name: "Test Batch M2O Debit Usage"
          code: "TBM2ODBU"

      - step: "Create product usage type for credit side"
        action: "create"
        model: "product.usage_type"
        save_as: "credit_usage"
        values:
          name: "Test Batch M2O Credit Usage"
          code: "TBM2OCRU"

      - step: "Create payslip type with manual debit and credit usage configurator"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Test Batch M2O Usage Manual Type"
          code: "TBM2OUSMAN"
          journal_id: "REC: journal.id"
          debit_usage_selection_method: "manual"
          debit_usage_ids:
            - "REC: debit_usage.id"
          credit_usage_selection_method: "manual"
          credit_usage_ids:
            - "REC: credit_usage.id"

      - step: "Create payslip batch"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type.id"
          date_start: "2026-02-01"
          date_end: "2026-02-28"
          date: "2026-02-28"

      - step: "Assert each usage field contains only its own side"
        action: "assert"
        target: "batch"
        asserts:
          allowed_debit_usage_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: debit_usage"
          allowed_credit_usage_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: credit_usage"

  - name:
      "HR Payslip Batch - Allowed analytic/debit/credit empty when manual lists are
      empty"
    steps:
      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Batch M2O Configurator Journal 3"
          code: "TBM2OJ3"
          type: "general"

      - step:
          "Create payslip type with manual configurators on all three fields, no records"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Test Batch M2O Empty Manual Type"
          code: "TBM2OEMPMAN"
          journal_id: "REC: journal.id"
          analytic_account_selection_method: "manual"
          debit_usage_selection_method: "manual"
          credit_usage_selection_method: "manual"

      - step: "Create payslip batch"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type.id"
          date_start: "2026-03-01"
          date_end: "2026-03-31"
          date: "2026-03-31"

      - step: "Assert all three allowed fields are empty"
        action: "assert"
        target: "batch"
        asserts:
          allowed_analytic_account_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          allowed_debit_usage_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          allowed_credit_usage_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  - name:
      "HR Payslip Batch - Allowed employees is the intersection with type configurator"
    steps:
      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Batch M2O Configurator Journal 4"
          code: "TBM2OJ4"
          type: "general"

      - step: "Create salary structure"
        action: "create"
        model: "hr.salary_structure"
        save_as: "structure"
        values:
          name: "Test Batch M2O Configurator Structure 4"
          code: "TBM2OSTR4"

      - step: "Create employee E-1 (has structure, listed on type)"
        action: "create"
        model: "hr.employee"
        save_as: "employee_1"
        values:
          name: "Test Batch M2O Employee E-1"
          salary_structure_id: "REC: structure.id"

      - step: "Create employee E-2 (has structure, NOT listed on type)"
        action: "create"
        model: "hr.employee"
        save_as: "employee_2"
        values:
          name: "Test Batch M2O Employee E-2"
          salary_structure_id: "REC: structure.id"

      - step: "Create employee E-3 (listed on type, no structure)"
        action: "create"
        model: "hr.employee"
        save_as: "employee_3"
        values:
          name: "Test Batch M2O Employee E-3"

      - step: "Create payslip type with manual employee configurator (E-1, E-3)"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Test Batch M2O Employee Manual Type"
          code: "TBM2OEMMAN"
          journal_id: "REC: journal.id"
          employee_selection_method: "manual"
          employee_ids:
            - "REC: employee_1.id"
            - "REC: employee_3.id"

      - step: "Create payslip batch"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type.id"
          date_start: "2026-04-01"
          date_end: "2026-04-30"
          date: "2026-04-30"

      - step:
          "Assert allowed employees contains only E-1 (E-2 not on type, E-3 no
          structure)"
        action: "assert"
        target: "batch"
        asserts:
          allowed_employee_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: employee_1"

  - name:
      "HR Payslip Batch - Allowed employees back-compat with unrestricted type domain"
    steps:
      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Batch M2O Configurator Journal 5"
          code: "TBM2OJ5"
          type: "general"

      - step: "Create salary structure"
        action: "create"
        model: "hr.salary_structure"
        save_as: "structure"
        values:
          name: "Test Batch M2O Configurator Structure 5"
          code: "TBM2OSTR5"

      - step: "Create employee E-1 (has structure)"
        action: "create"
        model: "hr.employee"
        save_as: "employee_1"
        values:
          name: "Test Batch M2O Employee Domain E-1"
          salary_structure_id: "REC: structure.id"

      - step: "Create employee E-2 (has structure)"
        action: "create"
        model: "hr.employee"
        save_as: "employee_2"
        values:
          name: "Test Batch M2O Employee Domain E-2"
          salary_structure_id: "REC: structure.id"

      - step: "Create employee E-3 (no structure)"
        action: "create"
        model: "hr.employee"
        save_as: "employee_3"
        values:
          name: "Test Batch M2O Employee Domain E-3"

      - step: "Create payslip type with default (unrestricted) employee domain"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Test Batch M2O Employee Domain Type"
          code: "TBM2OEMDOM"
          journal_id: "REC: journal.id"
          employee_selection_method: "domain"
          employee_domain: "[]"

      - step: "Create payslip batch"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type.id"
          date_start: "2026-05-01"
          date_end: "2026-05-31"
          date: "2026-05-31"

      - step:
          "Assert allowed employees contains E-1 and E-2 (both have structure), not E-3"
        action: "assert"
        target: "batch"
        asserts:
          allowed_employee_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: employee_1"
              - "REC: employee_2"
