      - step: "Create payslip batch"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['payslip_type'].id"
          date_start: "2024-06-01"
          date_end: "2024-06-30"
          date: "2024-06-30"
          employee_ids:
            - "EVAL: registry['employee'].id"

      - step: "Pre-create payslip linked to batch"
        action: "create"
        model: "hr.payslip"
        save_as: "payslip"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['payslip_type'].id"
          structure_id: "EVAL: registry['structure'].id"
          journal_id: "EVAL: registry['journal'].id"
          date_start: "2024-06-01"
          date_end: "2024-06-30"
          date: "2024-06-30"
          batch_id: "EVAL: registry['batch'].id"

      - step: "Open batch"
        action: "call"
        target: "batch"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Assert batch open after action_open"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Confirm batch"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert batch confirmed after action_confirm"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Reject batch"
        action: "call"
        target: "batch"
        method: "action_reject_approval"
        as_user: "base.user_admin"

      - step: "Assert batch rejected after action_reject_approval"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "reject"

      - step: "Restart batch"
        action: "call"
        target: "batch"
        method: "action_restart"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "draft"

