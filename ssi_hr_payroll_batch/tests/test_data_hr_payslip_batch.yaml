  - name: "HR Payslip Batch - Analytic account field persisted"
    steps:
      - step: "Create analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Batch Test Analytic Account"

      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Batch Analytic Test Journal"
          code: "TBTCHAN"
          type: "general"

      - step: "Create payslip type with analytic account"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Batch Analytic Payslip Type"
          code: "TSTBTCHANTYPE"
          journal_id: "EVAL: registry['journal'].id"
          analytic_account_id: "EVAL: registry['analytic_account'].id"

      - step: "Create payslip batch with analytic account"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['payslip_type'].id"
          analytic_account_id: "EVAL: registry['analytic_account'].id"
          date_start: "2024-10-01"
          date_end: "2024-10-31"
          date: "2024-10-31"

      - step: "Assert batch has analytic account"
        action: "assert"
        target: "batch"
        asserts:
          analytic_account_id:
            type: "value"
            operator: "is_truthy"

      - step: "Clear analytic account on batch"
        action: "write"
        target: "batch"
        values:
          analytic_account_id: false

      - step: "Assert analytic account cleared"
        action: "assert"
        target: "batch"
        asserts:
          analytic_account_id:
            type: "value"
            operator: "is_falsy"

  - name: "HR Payslip Batch - Import wizard ACL"
    steps:
      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Batch ACL Test Journal"
          code: "TBACL"
          type: "general"

      - step: "Create payslip type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Batch ACL Test Type"
          code: "TSTBTCHACLTYPE"
          journal_id: "REC: journal"

      - step: "Create payslip batch"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type"
          date_start: "2024-09-01"
          date_end: "2024-09-30"
          date: "2024-09-30"

      - step: "Create user with hr_payslip_batch_user_group"
        action: "create"
        model: "res.users"
        save_as: "batch_user"
        values:
          name: "Batch ACL Allowed User"
          login: "batch_acl_allowed@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: ssi_hr_payroll_batch.hr_payslip_batch_user_group"

      - step: "Create import wizard as allowed user"
        action: "create"
        model: "import_payslip_batch_input"
        save_as: "import_wizard"
        as_user: "batch_user"
        values:
          batch_id: "REC: batch"

      - step: "Assert wizard created with batch reference"
        action: "assert"
        target: "import_wizard"
        asserts:
          batch_id:
            type: "m2o"
            expected: "REC: batch"

      - step: "Create user without hr_payslip_batch_user_group"
        action: "create"
        model: "res.users"
        save_as: "unauthorized_user"
        values:
          name: "Batch ACL Unauthorized User"
          login: "batch_acl_unauthorized@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Create import wizard as unauthorized user is denied"
        action: "create"
        model: "import_payslip_batch_input"
        as_user: "unauthorized_user"
        expect_error:
          type: "AccessError"
        values:
          batch_id: "REC: batch"

  - name: "HR Payslip Batch - onchange_analytic_account_id set from type_id"
    steps:
      - step: "Create analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Batch OC Analytic"

      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Batch OC Journal"
          code: "TBOCJ01"
          type: "general"

      - step: "Create payslip type with analytic account"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Batch OC Type"
          code: "TBOCTYPE1"
          journal_id: "REC: journal"
          analytic_account_id: "REC: analytic_account"

      - step: "Set type_id on form and check onchange populates analytic_account_id"
        action: "form"
        model: "hr.payslip_batch"
        save: false
        values:
          type_id: "REC: payslip_type"
        asserts:
          analytic_account_id:
            type: "m2o"
            expected: "REC: analytic_account"

  - name: "HR Payslip Batch - onchange_analytic_account_id cleared when type_id changes"
    steps:
      - step: "Create analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Batch OC Analytic Clear"

      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Batch OC Journal Clear"
          code: "TBOCJ02"
          type: "general"

      - step: "Create payslip type with analytic account"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type_with"
        values:
          name: "Batch OC Type With Analytic"
          code: "TBOCTYPE2W"
          journal_id: "REC: journal"
          analytic_account_id: "REC: analytic_account"

      - step: "Create payslip type without analytic account"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type_without"
        values:
          name: "Batch OC Type Without Analytic"
          code: "TBOCTYPE2WO"
          journal_id: "REC: journal"

      - step: "Set type_id twice and check analytic_account_id is cleared"
        action: "form"
        model: "hr.payslip_batch"
        save: false
        ops:
          - set:
              type_id: "REC: payslip_type_with"
          - assert:
              analytic_account_id:
                type: "value"
                operator: "is_truthy"
          - set:
              type_id: "REC: payslip_type_without"
          - assert:
              analytic_account_id:
                type: "value"
                operator: "is_falsy"

  - name: "HR Payslip Batch - payslip_count reflects generated payslips"
    steps:
      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Batch Count Journal"
          code: "TBCNTJ"
          type: "general"

      - step: "Create salary rule category"
        action: "create"
        model: "hr.salary_rule_category"
        save_as: "category"
        values:
          name: "Batch Count Category"
          code: "TBCNTCAT"

      - step: "Create salary rule"
        action: "create"
        model: "hr.salary_rule"
        save_as: "rule"
        values:
          name: "Batch Count Rule"
          code: "TBCNTRULE"
          category_id: "REC: category"
          condition_python: "result = True"
          amount_python: "result = 100.0"
          sequence: 10

      - step: "Create salary structure"
        action: "create"
        model: "hr.salary_structure"
        save_as: "structure"
        values:
          name: "Batch Count Structure"
          code: "TBCNTSTR"
          rule_ids:
            - "REC: rule"

      - step: "Create payslip type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Batch Count Type"
          code: "TBCNTTYPE"
          journal_id: "REC: journal"

      - step: "Create employee with salary structure"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Batch Count Employee"
          salary_structure_id: "REC: structure"

      - step: "Create payslip batch with one employee"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type"
          date_start: "2024-11-01"
          date_end: "2024-11-30"
          date: "2024-11-30"
          employee_ids:
            - "REC: employee"

      - step: "Open batch to generate payslips"
        action: "call"
        target: "batch"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Assert payslip_count is 1"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          payslip_count:
            type: "value"
            expected: 1

  - name: "HR Payslip Batch - payslip_count is zero without payslips"
    steps:
      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Batch Empty Count Journal"
          code: "TBECJ"
          type: "general"

      - step: "Create payslip type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Batch Empty Count Type"
          code: "TBECTYPE"
          journal_id: "REC: journal"

      - step: "Create payslip batch without employees"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type"
          date_start: "2024-11-01"
          date_end: "2024-11-30"
          date: "2024-11-30"

      - step: "Assert payslip_count is 0"
        action: "assert"
        target: "batch"
        asserts:
          payslip_count:
            type: "value"
            expected: 0

