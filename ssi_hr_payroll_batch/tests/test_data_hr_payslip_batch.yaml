scenarios:
  - name: "HR Payslip Batch - Full Workflow: draft to done"
    steps:
      - step: "Get expense account type"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "expense_account_type"

      - step: "Create debit account"
        action: "create"
        model: "account.account"
        save_as: "debit_account"
        values:
          name: "Batch Test Debit Account"
          code: "TSTBTCH_DB"
          user_type_id: "EVAL: registry['expense_account_type'].id"

      - step: "Create credit account"
        action: "create"
        model: "account.account"
        save_as: "credit_account"
        values:
          name: "Batch Test Credit Account"
          code: "TSTBTCH_CR"
          user_type_id: "EVAL: registry['expense_account_type'].id"

      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Batch Test Payroll Journal"
          code: "TBTCH"
          type: "general"

      - step: "Create salary rule category"
        action: "create"
        model: "hr.salary_rule_category"
        save_as: "category"
        values:
          name: "Batch Test Category"
          code: "TSTBTCHCAT"

      - step: "Create salary rule"
        action: "create"
        model: "hr.salary_rule"
        save_as: "rule"
        values:
          name: "Batch Test Salary Rule"
          code: "TSTBTCHRULE"
          category_id: "EVAL: registry['category'].id"
          debit_account_id: "EVAL: registry['debit_account'].id"
          credit_account_id: "EVAL: registry['credit_account'].id"
          condition_python: "result = True"
          amount_python: "result = 100.0"
          sequence: 10

      - step: "Create salary structure"
        action: "create"
        model: "hr.salary_structure"
        save_as: "structure"
        values:
          name: "Batch Test Salary Structure"
          code: "TSTBTCHSTR"
          rule_ids:
            - "EVAL: registry['rule'].id"

      - step: "Create payslip type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Batch Test Payslip Type"
          code: "TSTBTCHTYPE"
          journal_id: "EVAL: registry['journal'].id"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Batch Test Employee"

      - step: "Create payslip batch"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['payslip_type'].id"
          date_start: "2024-05-01"
          date_end: "2024-05-31"
          date: "2024-05-31"
          employee_ids:
            - "EVAL: registry['employee'].id"

      - step: "Pre-create payslip linked to batch"
        action: "create"
        model: "hr.payslip"
        save_as: "payslip"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['payslip_type'].id"
          structure_id: "EVAL: registry['structure'].id"
          journal_id: "EVAL: registry['journal'].id"
          date_start: "2024-05-01"
          date_end: "2024-05-31"
          date: "2024-05-31"
          batch_id: "EVAL: registry['batch'].id"

      - step: "Assert batch created in draft"
        action: "assert"
        target: "batch"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Open batch"
        action: "call"
        target: "batch"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Assert batch open after action_open"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Compute payslips in batch"
        action: "call"
        target: "batch"
        method: "action_compute_payslip"
        as_user: "base.user_admin"

      - step: "Assert batch still open after compute"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Confirm batch"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert batch confirmed after action_confirm"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve batch to done"
        action: "call"
        target: "batch"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

