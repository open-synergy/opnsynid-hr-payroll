          date_start: "2026-04-01"
          date_end: "2026-04-30"
          date: "2026-04-30"

      - step: "Assert batch created with accounting_method payslip"
        action: "assert"
        target: "batch"
        asserts:
          accounting_method:
            type: "value"
            expected: "payslip"

  - name: "HR Payslip Batch Journaling - cancel deletes entries even without a move"
    steps:
      - step: "Get expense account type"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "expense_account_type"

      - step: "Create debit account"
        action: "create"
        model: "account.account"
        save_as: "debit_account"
        values:
          name: "JY25 Debit"
          code: "JY25DB"
          user_type_id: "REC: expense_account_type"

      - step: "Create credit account"
        action: "create"
        model: "account.account"
        save_as: "credit_account"
        values:
          name: "JY25 Credit"
          code: "JY25CR"
          user_type_id: "REC: expense_account_type"

      - step: "Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "JY25 Journal"
          code: "JY25JRN"
          type: "general"

      - step: "Create salary rule category"
        action: "create"
        model: "hr.salary_rule_category"
        save_as: "category"
        values:
          name: "JY25 Category"
          code: "JY25CAT"

      - step: "Create salary rule"
        action: "create"
        model: "hr.salary_rule"
        save_as: "rule"
        values:
          name: "JY25 Rule"
          code: "JY25RULE"
          category_id: "REC: category"
          debit_account_id: "REC: debit_account"
          credit_account_id: "REC: credit_account"
          condition_python: "result = True"
          amount_python: "result = 100.0"
          sequence: 10

      - step: "Create payslip type with batch accounting method"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "JY25 Type"
          code: "JY25TYPE"
          accounting_method: "batch"
          journal_id: "REC: journal"

      - step: "Create payslip batch, left in draft"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type"
          accounting_method: "batch"
          journal_id: "REC: journal"
          date_start: "2026-01-01"
          date_end: "2026-01-31"
          date: "2026-01-31"

      - step: "Create an account entry directly on the draft batch"
        action: "create"
        model: "hr.payslip_batch_account_entry"
        save_as: "entry"
        values:
          batch_id: "REC: batch"
          rule_id: "REC: rule"
          debit_account_id: "REC: debit_account"
          credit_account_id: "REC: credit_account"
          amount: 100.0

      - step: "Assert the batch precondition: entry present, no move"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          account_entry_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
          move_id:
            type: "value"
            operator: "is_falsy"

      - step: "Reverse the accounting entry directly"
        action: "call"
        target: "batch"
        method: "_xx_cancel_accounting_entry"

      - step: "Assert the entry no longer exists"
        action: "search"
        model: "hr.payslip_batch_account_entry"
        domain:
          - - "id"
            - "="
            - "REC: entry.id"
        save_as: "gone_entry"
        expect_count: 0

      - step: "Assert account_entry_ids is empty after cancel"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          account_entry_ids:
            type: "o2m"
            check: "count"
            expected_count: 0
