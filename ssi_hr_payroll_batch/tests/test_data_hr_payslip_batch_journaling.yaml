scenarios:
  - name: "HR Payslip Batch Journaling - default accounting_method is payslip"
    steps:
      - step: "Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "JY01 Journal"
          code: "JY01J"
          type: "general"

      - step: "Create payslip type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "JY01 Type"
          code: "JY01TYPE"
          journal_id: "REC: journal"

      - step: "Create payslip batch without setting accounting_method"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type"
          date_start: "2026-02-01"
          date_end: "2026-02-28"
          date: "2026-02-28"

      - step: "Assert accounting_method defaults to payslip"
        action: "assert"
        target: "batch"
        asserts:
          accounting_method:
            type: "value"
            expected: "payslip"

  - name: "HR Payslip Batch Journaling - batch method payslips done without a move"
    steps:
      - step: "Get expense account type"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "expense_account_type"

      - step: "Create debit account"
        action: "create"
        model: "account.account"
        save_as: "debit_account"
        values:
          name: "JY03 Debit"
          code: "JY03DB"
          user_type_id: "REC: expense_account_type"

      - step: "Create credit account"
        action: "create"
        model: "account.account"
        save_as: "credit_account"
        values:
          name: "JY03 Credit"
          code: "JY03CR"
          user_type_id: "REC: expense_account_type"

      - step: "Create default account"
        action: "create"
        model: "account.account"
        save_as: "default_account"
        values:
          name: "JY03 Default"
          code: "JY03DFT"
          user_type_id: "REC: expense_account_type"

      - step: "Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "JY03 Journal"
          code: "JY03JRN"
          type: "general"
          default_account_id: "REC: default_account"

      - step: "Create salary rule category"
        action: "create"
        model: "hr.salary_rule_category"
        save_as: "category"
        values:
          name: "JY03 Category"
          code: "JY03CAT"

      - step: "Create salary rule"
        action: "create"
        model: "hr.salary_rule"
        save_as: "rule"
        values:
          name: "JY03 Rule"
          code: "JY03RULE"
          category_id: "REC: category"
          debit_account_id: "REC: debit_account"
          credit_account_id: "REC: credit_account"
          condition_python: "result = True"
          amount_python: "result = 1000.0"
          sequence: 10

      - step: "Create salary structure"
        action: "create"
        model: "hr.salary_structure"
        save_as: "structure"
        values:
          name: "JY03 Structure"
          code: "JY03STR"
          rule_ids:
            - "REC: rule.id"

      - step: "Create payslip type with batch accounting method"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "JY03 Type"
          code: "JY03TYPE"
          accounting_method: "batch"
          journal_id: "REC: journal"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "JY03 Employee"
          salary_structure_id: "REC: structure"

      - step: "Create payslip batch with batch accounting method"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type"
          accounting_method: "batch"
          journal_id: "REC: journal"
          date_start: "2026-01-01"
          date_end: "2026-01-31"
          date: "2026-01-31"
          employee_ids:
            - "REC: employee.id"

      - step: "Open batch"
        action: "call"
        target: "batch"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Assert batch open after action_open"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Compute payslips in batch"
        action: "call"
        target: "batch"
        method: "action_compute_payslip"
        as_user: "base.user_admin"

      - step: "Assert batch still open after compute"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Confirm batch"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert batch confirmed after action_confirm"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve batch to done"
        action: "call"
        target: "batch"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert batch done after action_approve_approval"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Find the payslip generated for this batch"
        action: "search"
        model: "hr.payslip"
        domain:
          - - "batch_id"
            - "="
            - "REC: batch.id"
        save_as: "payslip"
        expect_count: 1

      - step: "Assert payslip is done without its own move"
        action: "assert"
        target: "payslip"
        asserts:
          state:
            type: "value"
            expected: "done"
          move_id:
            type: "value"
            operator: "is_falsy"

  - name: "HR Payslip Batch Journaling - cancel removes batch move"
    steps:
