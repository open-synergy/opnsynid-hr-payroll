        save_as: "payslip_type"
        values:
          name: "JY08 Type"
          code: "JY08TYPE"
          accounting_method: "batch"
          journal_id: "REC: journal"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "JY08 Employee"
          salary_structure_id: "REC: structure"

      - step: "Create payslip batch with batch accounting method"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: payslip_type"
          accounting_method: "batch"
          journal_id: "REC: journal"
          date_start: "2026-01-01"
          date_end: "2026-01-31"
          date: "2026-01-31"
          employee_ids:
            - "REC: employee.id"

      - step: "Open batch"
        action: "call"
        target: "batch"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Compute payslips in batch"
        action: "call"
        target: "batch"
        method: "action_compute_payslip"
        as_user: "base.user_admin"

      - step: "Confirm batch"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Approve batch to done"
        action: "call"
        target: "batch"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert batch done with a move before cancel"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"
          move_id:
            type: "value"
            operator: "is_truthy"

      - step: "Locate the move while it still exists"
        action: "search"
        model: "account.move"
        domain:
          - - "id"
            - "="
            - "REC: batch.move_id.id"
        save_as: "existing_move"
        expect_count: 1

      - step: "Cancel batch"
        action: "call"
        target: "batch"
        method: "action_cancel"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert batch move_id cleared after cancel"
        action: "assert"
        target: "batch"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "cancel"
          move_id:
            type: "value"
            operator: "is_falsy"
          account_entry_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

      - step: "Assert the account.move record no longer exists"
        action: "search"
        model: "account.move"
        domain:
          - - "id"
            - "="
            - "REC: existing_move.id"
        save_as: "deleted_move"
        expect_count: 0

  - name: "HR Payslip Batch Journaling - locked payslip action raises"
    steps:
      - step: "Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "JY15 Journal"
          code: "JY15J"
          type: "general"

      - step: "Create payslip type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "JY15 Type"
          code: "JY15TYPE"
          journal_id: "REC: journal"

      - step: "Create salary structure without rules"
        action: "create"
        model: "hr.salary_structure"
        save_as: "structure"
        values:
          name: "JY15 Structure"
          code: "JY15STR"

      - step: "Create employee"
        action: "create"
