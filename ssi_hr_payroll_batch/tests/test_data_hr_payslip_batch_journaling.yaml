          date_end: "2026-01-31"
          date: "2026-01-31"
          employee_ids:
            - "REC: employee.id"

      - step: "Open batch to generate the payslip"
        action: "call"
        target: "batch"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Find the generated payslip"
        action: "search"
        model: "hr.payslip"
        domain:
          - - "batch_id"
            - "="
            - "REC: batch.id"
        save_as: "payslip"
        expect_count: 1

      - step: "Confirming the payslip directly must raise"
        action: "call"
        target: "payslip"
        method: "action_confirm"
        expect_error:
          type: "UserError"

  - name: "HR Payslip Batch Journaling - onchange_accounting_method copies from type_id"
    steps:
      - step: "Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "JY17 Journal"
          code: "JY17J"
          type: "general"

      - step: "Create batch accounting method type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type_batch"
        values:
          name: "JY17 Batch Type"
          code: "JY17BT"
          accounting_method: "batch"
          journal_id: "REC: journal"

      - step: "Create payslip accounting method type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type_payslip"
        values:
          name: "JY17 Payslip Type"
          code: "JY17PT"
          accounting_method: "payslip"
          journal_id: "REC: journal"

      - step: "Set type_id twice and check accounting_method follows it"
        action: "form"
        model: "hr.payslip_batch"
        save: false
        ops:
          - set:
              type_id: "REC: payslip_type_batch"
          - assert:
              accounting_method:
                type: "value"
                expected: "batch"
          - assert:
              journal_id:
                type: "m2o"
                expected: "REC: journal"
          - set:
              type_id: "REC: payslip_type_payslip"
          - assert:
              accounting_method:
                type: "value"
                expected: "payslip"

  - name:
      "HR Payslip Batch Journaling - journal required when accounting_method is batch"
    steps:
