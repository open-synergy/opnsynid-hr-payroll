scenarios:
  - name: "HR Payslip Operating Unit - Create payslip with operating unit"
    steps:
      - step: "Get expense account type"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "expense_account_type"

      - step: "Create debit account"
        action: "create"
        model: "account.account"
        save_as: "debit_account"
        values:
          name: "OU Test Debit Account"
          code: "TSTOU_DB"
          user_type_id: "EVAL: registry['expense_account_type'].id"

      - step: "Create credit account"
        action: "create"
        model: "account.account"
        save_as: "credit_account"
        values:
          name: "OU Test Credit Account"
          code: "TSTOU_CR"
          user_type_id: "EVAL: registry['expense_account_type'].id"

      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "OU Test Payroll Journal"
          code: "TOU"
          type: "general"

      - step: "Create salary rule category"
        action: "create"
        model: "hr.salary_rule_category"
        save_as: "category"
        values:
          name: "OU Test Category"
          code: "TSTOUCAT"

      - step: "Create salary rule"
        action: "create"
        model: "hr.salary_rule"
        save_as: "rule"
        values:
          name: "OU Test Salary Rule"
          code: "TSTOURULE"
          category_id: "EVAL: registry['category'].id"
          debit_account_id: "EVAL: registry['debit_account'].id"
          credit_account_id: "EVAL: registry['credit_account'].id"
          condition_python: "result = True"
          amount_python: "result = 100.0"
          sequence: 10

      - step: "Create salary structure"
        action: "create"
        model: "hr.salary_structure"
        save_as: "structure"
        values:
          name: "OU Test Salary Structure"
          code: "TSTOUSTR"
          rule_ids:
            - "EVAL: registry['rule'].id"

      - step: "Create payslip type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "OU Test Payslip Type"
          code: "TSTOUTYPE"
          journal_id: "EVAL: registry['journal'].id"

      - step: "Get operating unit"
        action: "search"
        model: "operating.unit"
        domain: []
        save_as: "operating_unit"
        limit: 1
        order: "id asc"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "OU Test Employee"
          salary_structure_id: "EVAL: registry['structure'].id"

      - step: "Create payslip with operating unit"
        action: "create"
        model: "hr.payslip"
        save_as: "payslip"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['payslip_type'].id"
          structure_id: "EVAL: registry['structure'].id"
          journal_id: "EVAL: registry['journal'].id"
          date_start: "2024-01-01"
          date_end: "2024-01-31"
          date: "2024-01-31"
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Assert payslip created with operating unit"
        action: "assert"
        target: "payslip"
        asserts:
          state:
            type: "value"
            expected: "draft"
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

      - step: "Compute payslip"
        action: "call"
        target: "payslip"
        method: "action_compute_payslip"
        as_user: "base.user_admin"

      - step: "Reload input lines"
        action: "call"
        target: "payslip"
        method: "action_reload_input_lines"
        as_user: "base.user_admin"

      - step: "Confirm payslip"
        action: "call"
        target: "payslip"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve payslip"
        action: "call"
        target: "payslip"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert accounting entry created"
        action: "assert"
        target: "payslip"
        refresh: true
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"

      - step: "Get account move"
        action: "search"
        model: "account.move"
        domain:
          - ["id", "=", "EVAL: registry['payslip'].move_id.id"]
        save_as: "account_move"
        limit: 1

      - step: "Assert move has operating unit set"
        action: "assert"
        target: "account_move"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"
