scenarios:
  - name: "HR Payslip Batch Work Log - Create batch and verify work log mixin"
    steps:
      - step: "Get expense account type"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "expense_account_type"

      - step: "Create debit account"
        action: "create"
        model: "account.account"
        save_as: "debit_account"
        values:
          name: "Batch WL Test Debit Account"
          code: "TSTBWL_DB"
          user_type_id: "EVAL: registry['expense_account_type'].id"

      - step: "Create credit account"
        action: "create"
        model: "account.account"
        save_as: "credit_account"
        values:
          name: "Batch WL Test Credit Account"
          code: "TSTBWL_CR"
          user_type_id: "EVAL: registry['expense_account_type'].id"

      - step: "Create payroll journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Batch WL Test Payroll Journal"
          code: "TBWL"
          type: "general"

      - step: "Create salary rule category"
        action: "create"
        model: "hr.salary_rule_category"
        save_as: "category"
        values:
          name: "Batch WL Test Category"
          code: "TSTBWLCAT"

      - step: "Create salary rule"
        action: "create"
        model: "hr.salary_rule"
        save_as: "rule"
        values:
          name: "Batch WL Test Salary Rule"
          code: "TSTBWLRULE"
          category_id: "EVAL: registry['category'].id"
          debit_account_id: "EVAL: registry['debit_account'].id"
          credit_account_id: "EVAL: registry['credit_account'].id"
          condition_python: "result = True"
          amount_python: "result = 100.0"
          sequence: 10

      - step: "Create salary structure"
        action: "create"
        model: "hr.salary_structure"
        save_as: "structure"
        values:
          name: "Batch WL Test Salary Structure"
          code: "TSTBWLSTR"
          rule_ids:
            - "EVAL: registry['rule'].id"

      - step: "Create payslip type"
        action: "create"
        model: "hr.payslip_type"
        save_as: "payslip_type"
        values:
          name: "Batch WL Test Payslip Type"
          code: "TSTBWLTYPE"
          journal_id: "EVAL: registry['journal'].id"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Batch WL Test Employee"

      - step: "Create payslip batch"
        action: "create"
        model: "hr.payslip_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['payslip_type'].id"
          date_start: "2024-10-01"
          date_end: "2024-10-31"
          date: "2024-10-31"
          employee_ids:
            - "EVAL: registry['employee'].id"

      - step: "Assert batch created in draft"
        action: "assert"
        target: "batch"
        asserts:
          state:
            type: "value"
            expected: "draft"
